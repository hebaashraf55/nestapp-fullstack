# Render Blueprint for the public NOMA demo (free plans only: no charges).
# New → Blueprint → pick this repository. Render asks for the values marked `sync: false`;
# they are stored in Render, never in this file. JWT_SECRET is generated by Render.
#
# If Render gives a service a different URL than the names below (name already taken),
# update CORS_ORIGINS on the API and VITE_API_BASE_URL on the site to the real URLs.
services:
  - type: web
    name: noma-hebaashraf-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # Both seeds are idempotent: they create the admin, the two demo accounts and the synthetic
    # catalogue once, and leave existing records (and admin edits) alone on every later start.
    startCommand: node dist/seed/seed.js && node dist/seed/seed-catalogue-main.js && node dist/main
    # Readiness: 503 until MongoDB answers, so Render only routes traffic to a working instance.
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: PAYMENTS_MODE
        value: simulated
      - key: TRUST_PROXY
        value: "1"
      - key: OPENAPI_ENABLED
        value: "true"
      # disabled: no email provider yet (email sign-up and password reset cannot complete).
      # For working email set MAIL_TRANSPORT=smtp plus SMTP_URL and MAIL_FROM (see docs/AUTHENTICATION.md).
      - key: MAIL_TRANSPORT
        value: disabled
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # OAuth Web client id from Google Cloud; leave empty to hide "Continue with Google".
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://noma-hebaashraf.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false

  - type: web
    name: noma-hebaashraf
    runtime: static
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://noma-hebaashraf-api.onrender.com
      # Same Google client id as the API (public by design); empty hides the Google button.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # Client-side routing: every path serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
